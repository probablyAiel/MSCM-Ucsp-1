<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A calm, interactive map for keeping track of your people and connections." />
  <title>My Social Circle Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="My Social Circle Map home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>My Social Circle Map</span>
      </a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">I am <strong>Franzes Aiel R. Opiniano</strong>, and this is</p>
        <h1 id="page-title">A living map of <em>my social circle.</em></h1>
      </div>
    </section>

    <section class="workspace" aria-label="Social circle workspace">
      <div class="map-panel">
        <div class="map-toolbar">
          <div class="view-tabs" role="tablist" aria-label="Circle views">
            <button class="tab is-active" type="button" role="tab" aria-selected="true">Circle map</button>
            <button class="tab" type="button" role="tab" aria-selected="false">List view</button>
          </div>
          <button class="icon-button" id="reset-map" type="button" aria-label="Reset map positions" title="Reset positions">↺</button>
        </div>
        <div class="circle-map" id="circle-map">
          <div class="map-grid" aria-hidden="true"></div>
          <div class="ring-stage" aria-label="Social group circles">
            <div class="circle-ring ring-primary" data-ring="1"><span>Primary Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-secondary" data-ring="2"><span>Secondary Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-reference" data-ring="3"><span>Reference Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-in" data-ring="4"><span>In Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-out" data-ring="5"><span>Out Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-virtual" data-ring="6"><span>Virtual Groups</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-gemeinschaft" data-ring="7"><span>Gemeinschaft</span><div class="ring-track"></div></div>
            <div class="circle-ring ring-gesellschaft" data-ring="8"><span>Gesellschaft</span><div class="ring-track"></div></div>
          </div>
          <div class="connections-layer" id="connections-layer" aria-hidden="true">
            <div class="connection" data-ring="1"></div>
            <div class="connection" data-ring="2"></div>
            <div class="connection" data-ring="3"></div>
            <div class="connection" data-ring="4"></div>
            <div class="connection" data-ring="5"></div>
            <div class="connection" data-ring="6"></div>
            <div class="connection" data-ring="7"></div>
            <div class="connection" data-ring="8"></div>
          </div>
          <div class="you-node">
            <span class="you-initials">ME</span>
            <span class="you-label">You</span>
          </div>
          <article class="person-card" id="person-card" aria-hidden="true" aria-live="polite">
            <button class="card-close" id="card-close" type="button" aria-label="Close person card">×</button>
            <div class="card-portrait-wrap"><img class="card-portrait" id="card-portrait" alt="" /></div>
            <div class="card-content">
              <p class="card-kicker">A person in my circle</p>
              <h2 id="card-name"></h2>
              <dl class="card-details">
                <div><dt>Relationship</dt><dd id="card-role"></dd></div>
                <div><dt>Group</dt><dd id="card-group"></dd></div>
              </dl>
              <p class="card-note" id="card-note"></p>
            </div>
          </article>
          <div class="map-hint"><span aria-hidden="true">✥</span> Drag to arrange</div>
        </div>
      </div>

    </section>
  </main>

  <script src="app.js?v=9"></script>
</body>
</html>
