<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A calm, interactive map for keeping track of your people and connections." />
  <title>My Social Circle Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="My Social Circle Map home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>My Social Circle Map</span>
      </a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">I am <strong>Franzes Aiel R. Opiniano</strong>, and this is</p>
        <h1 id="page-title">A living map of <em>my social circle.</em></h1>
      </div>
    </section>

    <section class="workspace" aria-label="Social circle workspace">
      <div class="map-panel">
        <div class="map-toolbar">
          <div class="view-tabs" role="tablist" aria-label="Circle views">
            <button class="tab is-active" type="button" role="tab" aria-selected="true">Circle map</button>
            <button class="tab" type="button" role="tab" aria-selected="false">List view</button>
          </div>
          <button class="icon-button" id="reset-map" type="button" aria-label="Reset map positions" title="Reset positions">↺</button>
        </div>
        <div class="circle-map" id="circle-map">
          <div class="map-grid" aria-hidden="true"></div>
          <div class="orbit orbit-outer" aria-hidden="true"></div>
          <div class="orbit orbit-inner" aria-hidden="true"></div>
          <div class="connection connection-a" aria-hidden="true"></div>
          <div class="connection connection-b" aria-hidden="true"></div>
          <div class="connection connection-c" aria-hidden="true"></div>
          <div class="you-node">
            <span class="you-initials">JD</span>
            <span class="you-label">You</span>
          </div>
          <div class="people-layer" id="people-layer"></div>
          <div class="map-hint"><span aria-hidden="true">✥</span> Drag to arrange</div>
        </div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
